name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Inline Tailwind CSS
        run: |
          H=app/src/main/assets/index.html
          printf '@tailwind base;@tailwind components;@tailwind utilities;' > in.css
          npx --yes tailwindcss@3.4.17 -i in.css -o tw.css --content "$H" --minify
          python3 - <<'PY'
          p='app/src/main/assets/index.html'
          s=open(p,encoding='utf-8').read()
          css=open('tw.css',encoding='utf-8').read()
          tag='<script src="https://cdn.tailwindcss.com"></script>'
          assert tag in s
          open(p,'w',encoding='utf-8').write(s.replace(tag,'<style>'+css+'</style>'))
          PY
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AgeOfEmpires-APK
          path: app/build/outputs/apk/debug/app-debug.apk
